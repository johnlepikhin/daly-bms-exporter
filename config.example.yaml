# daly-bms-exporter configuration (YAML). All fields are optional; omitted keys
# fall back to the defaults shown below. A missing config file is not an error.

# Address:port the exporter binds to — receives device POSTs AND serves /metrics.
# The Hlktech module POSTs to port 80 of www.databms.com, so either bind here to
# :80 (needs CAP_NET_BIND_SERVICE) or DNAT :80 -> this port. See README.
listen: "0.0.0.0:8080"

# Path Prometheus scrapes.
metrics_path: "/metrics"

# Default log filter when RUST_LOG is unset (error|warn|info|debug|trace, or a
# full tracing-subscriber EnvFilter directive).
log_level: "info"

# Optional allowlist of accepted BMS serials. When set, telemetry from any other
# serial is dropped — this bounds metric cardinality against untrusted input.
# Omit or leave null to accept any plausible (ASCII-alphanumeric) serial.
#
# In untrusted networks, set this to your known device serials. The device cap
# (max_devices, below) is first-come and slots are never evicted, so with
# allowed_serials unset an unauthenticated flood of distinct plausible serials
# can exhaust max_devices and permanently lock out real devices.
# allowed_serials:
#   - "224KE220900366"

# Reject request bodies larger than this (bytes). Real bodies are ~1.2 KB.
max_body_bytes: 65536

# Per-request timeout (seconds).
request_timeout_secs: 10

# Coulomb counter: cap the integration interval between frames (seconds). If the
# device goes offline longer than this, the gap is not integrated with a stale
# current reading. ~2x the device's post interval plus margin is a good value.
coulomb_max_gap_secs: 900

# Hard cap on the number of distinct devices (serials) tracked, bounding metric
# cardinality / memory against untrusted Sn values. 0 = unlimited. This cap is
# first-come and slots are never evicted: without allowed_serials, a flood of
# distinct serials can fill it and starve real devices — set allowed_serials
# (above) on untrusted networks.
max_devices: 64

# Persist the coulomb counters (charge/discharge amp-hours) to this JSON file so
# the totals survive restarts (otherwise they reset to zero on every restart).
# The systemd unit provides a writable StateDirectory at /var/lib/daly-bms-exporter.
# Omit to disable persistence.
coulomb_state_path: "/var/lib/daly-bms-exporter/coulombs.json"

# Minimum interval between durable writes of the state file above (seconds,
# outside 1..=3600 falls back to the default of 5). Every accepted frame stages
# its delta; the delta is
# applied to the exported counters only once the file containing it has been
# fsynced, so deltas arriving inside the window are held, not lost. Two reasons
# this is not zero: the fsync happens on the same thread that serves /metrics,
# and the ingest endpoint is unauthenticated, so this is also the rate limit on
# how often a flood of POSTs can force a disk sync. A SIGKILL loses at most one
# window's worth, so keep it below the device's post interval (~200 s).
coulomb_state_min_interval_secs: 5

# Plausibility gate. A realtime frame whose current or pack voltage falls
# outside these bounds is dropped whole, before it reaches any metric: no gauge
# is updated, nothing is integrated, and the frame is counted in
# daly_bms_frames_dropped_total{reason="implausible_current"|"implausible_voltage"}
# and logged at warn with its raw hex. The wire encoding reaches 3553 A and
# 6553 V; the controller has been seen emitting a single 436.6 A register in an
# otherwise sane, CRC-valid frame. Passed through, that is a phantom spike on
# every current/power panel and, since the counters are monotonic, kilowatt-hours
# that can never be removed. Defaults leave ~3x headroom over the observed
# production peaks (~33 A, 22..29 V on an LTO 24S bank).
max_plausible_current_amperes: 100.0
min_plausible_pack_volts: 18.0
max_plausible_pack_volts: 34.0

# Second line of defence: the most one frame may add to the counters, in case
# the integration itself misbehaves. The defaults sit just above what the gate
# and coulomb_max_gap_secs already permit together (100 A sustained for a whole
# 900 s gap = 25 Ah), because that combination is a real reading after a comms
# drop rather than an anomaly — clamping it would under-count energy after every
# outage. Lower them only if the pack physically cannot take that much in one
# interval; startup warns when they are set below that product.
max_frame_amp_hours: 25.0
max_frame_watt_hours: 900.0

# --- Current-sensor self-calibration ----------------------------------------
#
# The BMS current register has a per-unit zero-point error. Integrated around
# the clock it becomes phantom charge: in production one pack of three sat at
# +150 mA, which is 3.6 Ah/day of "charge in" that never came back out and made
# its energy-in counter outrun energy-out by 25% while its state of charge never
# moved.
#
# The estimator uses the charge balance every pack obeys,
#
#     ∫I dt = ΔQ + ∫I_balance dt + offset·T + ε
#
# where Q is the BMS-reported remaining capacity. The offset is the slope of
# that residual over time, fitted continuously with exponential forgetting.
# Q comes from the BMS's own (equally biased) counter, but it is clamped to
# 0..=capacity, so it can shift the fitted slope by at most Cap/window — a bound
# the exporter computes and gates on, rather than trusting Q's value.
#
# The correction feeds a PARALLEL set of counters, daly_bms_calibrated_*. The
# raw daly_bms_charge/discharge_* counters are never touched, so a bad estimate
# can never damage the primary record.
calibration_enabled: true

# Forgetting time constant of the estimator, in *integrated* hours (time the
# coulomb counter actually integrated over, so comms outages do not count).
# Long on purpose: the offset drifts far slower than the noise around it — a
# month of production data moved it by under 40 mA — and the accuracy bound
# below improves with the window.
calibration_tau_hours: 1440

# Floor on the integrated hours before any correction is applied. Normally the
# anchor-error gate below binds first; this just stops a pathological config
# from correcting on a handful of frames.
calibration_min_span_hours: 168

# Hard clamp on the applied offset, whatever the estimator concludes.
calibration_max_offset_amperes: 0.5

# Hold the correction until the estimate is provably good to within this many
# amperes — i.e. until Cap/window drops below it. On a 40 Ah pack, 0.05 A is
# reached after ~800 integrated hours (~33 days), and the exporter exports its
# progress as daly_bms_calibration_anchor_error_amperes. Set to 0 to run the
# estimator in observe-only mode: it keeps publishing
# daly_bms_current_offset_estimate_amperes but never applies it.
calibration_max_anchor_error_amperes: 0.05

# Cross-check. Packs wired in parallel carry near-identical current, so
# regressing one pack's reading against another's measures the difference of
# their zero errors directly — without any loss term. The exporter discovers
# such peers from the data (slope near 1, high R²) and compares.
#
# The two estimates are NOT expected to match exactly: the balance equation also
# absorbs real losses the balancer under-reports, while the peer regression sees
# the sensor alone. In production they sit ~50 mA apart. This threshold is for
# gross breakage — a failing sensor, a pack leaving the bank — and freezes the
# applied offset at its last good value when it trips (visible as
# daly_bms_calibration_hold = 4).
calibration_peer_max_disagreement_amperes: 0.25
